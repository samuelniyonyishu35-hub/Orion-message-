name: Build ORION APK
on:
  push:
    branches: [ "main", "feature/sms-cloud-backup" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore persistent ORION signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ORION_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ORION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ORION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ORION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orion-release.jks"
          test -s "$RUNNER_TEMP/orion-release.jks"
          {
            printf 'ORION_STORE_FILE=%s\n' "$RUNNER_TEMP/orion-release.jks"
            printf 'ORION_STORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'ORION_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'ORION_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Download bundled fonts
        run: |
          mkdir -p app/src/main/res/font app/src/main/assets/font-licenses
          curl --retry 3 -fLsS 'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf' -o app/src/main/res/font/inter.ttf
          curl --retry 3 -fLsS 'https://raw.githubusercontent.com/google/fonts/main/ofl/roboto/Roboto%5Bwdth%2Cwght%5D.ttf' -o app/src/main/res/font/roboto.ttf
          curl --retry 3 -fLsS 'https://raw.githubusercontent.com/google/fonts/main/ofl/nunito/Nunito%5Bwght%5D.ttf' -o app/src/main/res/font/nunito.ttf
          curl --retry 3 -fLsS 'https://raw.githubusercontent.com/google/fonts/main/ofl/caveat/Caveat%5Bwght%5D.ttf' -o app/src/main/res/font/caveat.ttf
          curl --retry 3 -fLsS 'https://raw.githubusercontent.com/google/fonts/main/ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf' -o app/src/main/res/font/playfair_display.ttf
          curl --retry 3 -fLsS 'https://raw.githubusercontent.com/google/fonts/main/ofl/sourcecodepro/SourceCodePro%5Bwght%5D.ttf' -o app/src/main/res/font/source_code_pro.ttf
          curl --retry 3 -fLsS 'https://raw.githubusercontent.com/google/fonts/main/ofl/oswald/Oswald%5Bwght%5D.ttf' -o app/src/main/res/font/oswald.ttf
          curl --retry 3 -fLsS 'https://raw.githubusercontent.com/google/fonts/main/ofl/lato/Lato-Regular.ttf' -o app/src/main/res/font/lato.ttf
          curl --retry 3 -fLsS 'https://raw.githubusercontent.com/google/fonts/main/ofl/pacifico/Pacifico-Regular.ttf' -o app/src/main/res/font/pacifico.ttf
          curl --retry 3 -fLsS 'https://raw.githubusercontent.com/google/fonts/main/ofl/dancingscript/DancingScript%5Bwght%5D.ttf' -o app/src/main/res/font/dancing_script.ttf
          curl --retry 3 -fLsS 'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/OFL.txt' -o app/src/main/assets/font-licenses/inter-OFL.txt
          curl --retry 3 -fLsS 'https://raw.githubusercontent.com/google/fonts/main/ofl/roboto/OFL.txt' -o app/src/main/assets/font-licenses/roboto-OFL.txt
          curl --retry 3 -fLsS 'https://raw.githubusercontent.com/google/fonts/main/ofl/nunito/OFL.txt' -o app/src/main/assets/font-licenses/nunito-OFL.txt
          curl --retry 3 -fLsS 'https://raw.githubusercontent.com/google/fonts/main/ofl/caveat/OFL.txt' -o app/src/main/assets/font-licenses/caveat-OFL.txt
          curl --retry 3 -fLsS 'https://raw.githubusercontent.com/google/fonts/main/ofl/playfairdisplay/OFL.txt' -o app/src/main/assets/font-licenses/playfairdisplay-OFL.txt
          curl --retry 3 -fLsS 'https://raw.githubusercontent.com/google/fonts/main/ofl/sourcecodepro/OFL.txt' -o app/src/main/assets/font-licenses/sourcecodepro-OFL.txt
          curl --retry 3 -fLsS 'https://raw.githubusercontent.com/google/fonts/main/ofl/oswald/OFL.txt' -o app/src/main/assets/font-licenses/oswald-OFL.txt
          curl --retry 3 -fLsS 'https://raw.githubusercontent.com/google/fonts/main/ofl/lato/OFL.txt' -o app/src/main/assets/font-licenses/lato-OFL.txt
          curl --retry 3 -fLsS 'https://raw.githubusercontent.com/google/fonts/main/ofl/pacifico/OFL.txt' -o app/src/main/assets/font-licenses/pacifico-OFL.txt
          curl --retry 3 -fLsS 'https://raw.githubusercontent.com/google/fonts/main/ofl/dancingscript/OFL.txt' -o app/src/main/assets/font-licenses/dancingscript-OFL.txt
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORION-Messages-1.0.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
